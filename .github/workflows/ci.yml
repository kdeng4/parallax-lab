name: Validate Parallax Lab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: parallax-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: parallax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARALLAX_TEST_DATABASE_URL: postgresql://postgres:postgres-test-only@localhost:5432/parallax_test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release language
        run: python3 scripts/check_release_language.py
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: apps/api
        run: uv sync --locked --group dev
      - name: Validate accounting, causality, persistence and HTTP API with coverage
        working-directory: apps/api
        run: uv run --frozen --group dev pytest --cov=parallax_lab --cov-branch --cov-report=term-missing --cov-fail-under=90
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Install locked dependencies
        run: bash scripts/setup.sh
      - name: Type check and build production frontend
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run test:proxy
          VERCEL=1 npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows against isolated API
        working-directory: apps/web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose and build images
        run: |
          docker compose config --quiet
          docker compose build
