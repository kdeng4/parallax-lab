[project]
name = "parallax-lab-api"
version = "0.1.0"
description = "Reproducible paper-trading experiments and audit API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.8",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parallax_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
