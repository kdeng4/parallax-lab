name: parallax-lab
services:
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      PARALLAX_DATABASE_URL: sqlite:////app/.data/parallax-lab.db
    volumes:
      - paper-data:/app/.data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  web:
    environment:
      PARALLAX_LOCAL_WRITE_ACCESS: '1'
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  paper-data:
